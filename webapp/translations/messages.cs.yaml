'Your program crashed or ended with an exit code other than 0, for example by dividing by zero, reading outside an array, or returning something other than 0 from main.': 'Program spadl nebo skončil s jiným návratovým kódem než 0, například dělením nulou, čtením mimo pole nebo tím, že main nevrátil 0.'
'Your program ended without printing anything. Check that it prints the answer.': 'Program skončil, aniž by cokoli vypsal. Zkontrolujte, že vypisuje odpověď.'
'Your program gave the right output on every test.': 'Váš program dal správný výstup ve všech testech.'
'Your program printed much more output than expected, often from printing inside an endless loop.': 'Program vypsal mnohem víc výstupu, než se čekalo, často kvůli výpisu v nekonečném cyklu.'
'Your program ran longer than the time limit on at least one test. Look for an endless loop, waiting for input that never comes, or an algorithm that is too slow.': 'Aspoň v jednom testu běžel program déle, než je časový limit. Hledejte nekonečný cyklus, čekání na vstup, který nepřijde, nebo příliš pomalý algoritmus.'
'Your program ran, but its output differs from the expected output on at least one test. Check the output format, the edge cases, and that you print nothing extra.': 'Program doběhl, ale aspoň v jednom testu se jeho výstup liší od očekávaného. Zkontrolujte formát výstupu, okrajové případy a to, že nevypisujete nic navíc.'
'Your program used more memory than allowed. Look for very large arrays or recursion that goes too deep.': 'Program spotřeboval víc paměti, než je povoleno. Hledejte příliš velká pole nebo příliš hlubokou rekurzi.'
'Your submission is waiting to be judged or is being judged.': 'Odevzdání čeká na vyhodnocení nebo se právě vyhodnocuje.'
'Your unsaved changes from %when% were restored. Save or submit to keep them.': 'Vaše neuložené změny z %when% byly obnoveny. Uložte je nebo odevzdejte, aby se neztratily.'
