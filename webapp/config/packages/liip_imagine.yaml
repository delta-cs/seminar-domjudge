# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"

    # The legacy Twig integration is deprecated since 2.7.
    twig:
        mode: lazy
    # The symfony/templating integration is deprecated too and loads the
    # deprecated FilterTrait (#88). DOMjudge only uses the Twig filter.
    templating: false

    resolvers:
        default:
            web_path: ~

    webp:
        generate: true

    filter_sets:
        cache: ~

    default_filter_set_settings:
        format: webp
