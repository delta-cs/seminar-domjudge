name: Run PHPStan
on:
  workflow_call:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest now ships PHP 8.5, under which the locked PHPStan (2.1.17)
      # misreads attribute flags and reports every repeated attribute as "not
      # repeatable" (191 false errors). Pin the newest PHP the unit tests cover.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, mysqli, pcntl, zip
          tools: composer
      - name: Setup composer dependencies
        run: .github/jobs/composer_setup.sh
      - name: Show the phpstan version
        run: webapp/vendor/phpstan/phpstan/phpstan --version
      - name: Run PHPStan in the classic way
        run: |
          set -euo pipefail
          webapp/vendor/bin/phpstan \
            --configuration=webapp/phpstan.dist.neon \
          | tee /tmp/artifacts/phpstan.out
      # Run the test again for GHA annotations
      - uses: php-actions/phpstan@v3.0.2
        with:
          php_version: '8.4'
          configuration: webapp/phpstan.dist.neon
          php_extensions: gd intl mysqli pcntl zip
          autoload_file: webapp/vendor/autoload.php
          version: composer
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          path: /tmp/artifacts
